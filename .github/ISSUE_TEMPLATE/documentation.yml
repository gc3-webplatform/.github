name: Documentation
description: Write or correct a doc, README or ADR
type: Documentation

body:
  - type: markdown
    attributes:
      value: |
        Title: state the outcome, not the area (e.g. "Upgrade the build image to Node 22", not "Build image").
        Assign one owner with *Assignees* before work starts.

  - type: textarea
    id: intent
    attributes:
      label: Intent
      description: Which doc, README or ADR, what is missing or wrong in it, and who reads it.
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      description: What to hand over, one per line, such as a PR, a doc or a decision written in this issue. The issue is done when every line is ticked.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links, related issues, people to check with, constraints.
