name: Maintenance
description: Upgrade, clean up or keep something running, with no change in behaviour
type: Maintenance

body:
  - type: markdown
    attributes:
      value: |
        Title: state the outcome, not the area (e.g. "Upgrade the build image to Node 22", not "Build image").
        Assign one owner with *Assignees* before work starts.

  - type: textarea
    id: intent
    attributes:
      label: Intent
      description: What to upgrade, clean up or keep running, and why now (end of support, security fix, build warning).
    validations:
      required: true

  - type: textarea
    id: unchanged
    attributes:
      label: What must not change
      description: The behaviour users rely on, and how to check it still works afterwards.

  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      description: What to hand over, one per line, such as a PR, a doc or a decision written in this issue. The issue is done when every line is ticked.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links, related issues, people to check with, constraints.
